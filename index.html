<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Recetas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<link rel="icon" type="image/svg+xml" href="favicon-v2.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="manifest" href="manifest-v2.webmanifest">
<meta name="theme-color" content="#1F4A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Recetas">
<style>
/* Layout: una columna estrecha pensada para iPhone; cabecera fija, tres pestañas abajo, hojas que suben desde abajo para editar. */
:root{
  --bg:#F1F3EC; --surface:#FBFBF8; --surface2:#E6EAE0; --ink:#18241C; --muted:#5A675D; --line:#D3D9C8;
  --brand:#1F4A33; --brand-ink:#F3F7EF; --accent:#C0391B; --prot:#2A6384;
  --f-display:'Young Serif',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1712; --surface:#17221B; --surface2:#203026; --ink:#E6EDE3; --muted:#9DAE9F; --line:#2C3C31;
    --brand:#7BC49A; --brand-ink:#0E1A13; --accent:#FF8A66; --prot:#86BBDA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221B; --surface2:#203026; --ink:#E6EDE3; --muted:#9DAE9F; --line:#2C3C31;
  --brand:#7BC49A; --brand-ink:#0E1A13; --accent:#FF8A66; --prot:#86BBDA; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top h1{font:400 24px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-align:center}
.sync{font-size:11px;line-height:1.2;color:var(--muted);text-align:right;justify-self:end}
main{padding-top:16px;min-width:0}
h2{font:400 21px/1.2 var(--f-display);margin:0}
h3{font:400 20px/1.2 var(--f-display);margin:0}
h4{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.row.between{justify-content:space-between}
.gap{gap:8px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.lnk{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 0;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);width:40px;height:40px;border-radius:8px;flex:none}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;min-width:0}
input[type=search]{-webkit-appearance:none;appearance:none}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
.note{color:var(--muted);font-size:13px;margin-top:20px}
.tag{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px}

/* recetas */
.rc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.rc-main{background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-t{font:600 17px/1.25 var(--f-body)}
.rc-m{font-size:13px;color:var(--muted)}
.rc-k{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.rc-k b{font:500 26px/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.rc-k small{font-size:11px;color:var(--muted)}
.rc .btn{grid-column:1/-1;justify-self:start;margin-top:8px}

/* semana */
.wk{display:flex;align-items:center;gap:8px;margin:12px 0}
.wk .lab{flex:1;text-align:center;font-weight:600}
.wk .btn{padding:8px 14px;min-width:44px}
.goals{display:flex;justify-content:center;align-items:center;gap:14px;margin:12px 0 16px}
.goal{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.goal .inp{width:78px;text-align:center;padding:10px 4px;font-family:var(--f-mono)}
.goal #pgoal{width:62px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.day.today{border-color:var(--brand);border-width:2px;padding:13px}
.dh{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.dh .dn{font:600 16px var(--f-body);text-transform:capitalize}
.dh .dk{font:500 15px var(--f-mono);color:var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--surface2);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.over i{background:var(--accent)}
.slot{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ent{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
.ent-n{flex:1 1 100%;font-weight:500}
.step{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.step button{background:none;border:0;width:38px;height:36px;font-size:18px}
.step b{min-width:24px;text-align:center;font-family:var(--f-mono)}
.ent .k{margin-left:auto;font-size:14px;color:var(--muted)}

/* compra */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.sw span.t{width:42px;height:24px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none}
.sw span.t::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"] span.t{background:var(--brand);border-color:var(--brand)}
.sw[aria-checked="true"] span.t::after{transform:translateX(18px);background:var(--brand-ink)}
.cat{margin-top:18px}
.it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;text-align:left;min-height:46px}
.cb{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center}
.it.done .cb{background:var(--brand);border-color:var(--brand)}
.it.done .cb::after{content:"";width:6px;height:11px;border:solid var(--brand-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .n{flex:1;min-width:0}
.it .a{font:500 14px var(--f-mono);color:var(--muted);white-space:nowrap}
.it.done .n,.it.done .a{text-decoration:line-through;color:var(--muted)}
.want{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.want .ent-n{flex:1 1 100%}

/* hojas */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,10,.55)}
.panel{position:relative;width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.kbox{display:flex;gap:12px;margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kbox div{flex:1;display:flex;flex-direction:column}
.kbox b{font-size:24px;font-weight:500;color:var(--accent)}
.kbox small{color:var(--muted);font-size:12px}
.ing{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow{display:flex;align-items:center;gap:8px}
.qrow .q{width:110px;flex:none}
.qrow .u{color:var(--muted);font-size:14px}
.qrow .lk{margin-left:auto;font-size:13px;color:var(--muted)}
.fr{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.frh{display:flex;align-items:center;gap:8px}
.fr .fn{flex:1;min-width:0;font-weight:500}
.fr .fn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.mfs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.mf .inp{padding:8px 6px;min-height:40px;text-align:right;font-family:var(--f-mono)}
.mac{font-size:13px;color:var(--muted);text-align:center}
.pbar{margin-top:0}
.pbar i{background:var(--prot)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.fe{display:flex;flex-direction:column;gap:8px;padding:10px;margin-top:6px;border:1px solid var(--line);border-radius:12px}
.fr .ed{background:none;border:0;color:var(--brand);font-size:13px;padding:6px 0;cursor:pointer}
.pk{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;text-align:left}
.pk b{font:500 15px var(--f-mono);color:var(--accent);white-space:nowrap}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;gap:6px;max-width:640px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{background:var(--surface2);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:90vw}
@media (prefers-reduced-motion: reduce){.sw span.t::after{transition:none}}

/* centrado general */
.hd{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.center{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
h4,.note,.lbl,.rc-m,.pk{text-align:center}
#q,#pk-q,#r-name,#r-serv,#extra-new,.fgrid input.inp{text-align:center}
select.inp{text-align:center;text-align-last:center}
#fp-q{text-align:center}
.selbtn{display:block;text-align:center;cursor:pointer}
.selbtn::after{content:" ▾";color:var(--muted)}
.selbtn.none{color:var(--muted)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.fc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:76px;min-width:0;padding:10px 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.fc .fcn{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.fc b{font:500 13px var(--f-mono);color:var(--accent)}
.fc:active{background:var(--surface2)}
.rc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.rc-main,.rc-k{align-items:center;text-align:center}
.rc .btn{margin-top:6px}
.slot-h{justify-content:center;gap:14px}
.ent{justify-content:center}
.ent-n{text-align:center}
.ent .k{margin-left:0}
.want{justify-content:center;padding:12px 14px}
.want .x{margin-left:0}
.panel .row{justify-content:center}
.ph,.frh{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.ph::before{content:""}
.ph h3,.fr .fn{text-align:center}
.kbox div{align-items:center;text-align:center}
.qrow{justify-content:center}
.qrow .lk{margin-left:0}
.mf{align-items:center}
.mf .inp{text-align:center}
.pk{flex-direction:column;justify-content:center;gap:2px}

[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#login .logo{width:84px;height:84px}
#login .inp{max-width:320px;text-align:center}
#login p{margin:0;color:var(--muted);min-height:20px}
#sc-box{width:100%;min-height:220px;border-radius:12px;overflow:hidden;background:#000}
#sc-box video{width:100%!important}
.top h1{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:30px;height:30px;flex:none}
/* fichas, modo cocinar y editor ampliado */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 2px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:transparent;font-size:14px;min-height:36px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.panel .chips{margin:6px 0 4px}
.fph{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.fph.big{max-height:260px;margin:8px 0}
.rc-ph{background:none;border:0;padding:0;width:100%;display:block}
.tag2{display:inline-block;font-size:12px;letter-spacing:.04em;border:1px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--muted)}
.times{display:flex;justify-content:center;gap:8px;margin:10px 0}
.times div{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.times b{font:500 16px var(--f-mono)}
.times small{color:var(--muted);font-size:12px}
.mets{display:flex;flex-direction:column;align-items:center;gap:6px}
.met{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;text-align:center}
.ir{padding:8px 0;border-bottom:1px solid var(--line);text-align:center}
.ir b{margin-right:8px;color:var(--accent);font-weight:500}
.st{padding:12px 4px;border-bottom:1px solid var(--line);text-align:center}
.st .sn{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.st p{margin:4px 0 6px;line-height:1.5}
.nt{text-align:center;color:var(--muted);font-style:italic}
.panel.full{height:100%;max-height:100%;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.bigstep{font-size:22px;line-height:1.45;text-align:center;margin:18px 0}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;margin:18px 0}
.tm{font-size:56px;font-weight:500;color:var(--accent)}
.nav{margin-top:22px}
.nav .btn{min-width:130px}
label.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.srow,.met-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
textarea.inp{min-height:84px;line-height:1.4;resize:vertical;font-family:var(--f-body)}
.srow .qrow .inp,.met-row .qrow .inp{min-width:0;flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);text-align:center}
.rc-ph .fph{max-height:150px}
</style>
</head>

<div id="app">

  var key=lsGet('rc-gkey').replace(/[^\x21-\x7E]/g,'');if(!key)return Promise.reject({code:'no_key'});
  var imgs=(opts&&opts.images)||[];
  return Promise.all(imgs.map(function(b){return toDataUrl(b).then(function(u){return u.split(',')[1]})})).then(function(bs){
    var parts=[{text:prompt}];bs.forEach(function(d){parts.push({inline_data:{mime_type:'image/jpeg',data:d}})});
    var body=JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:{responseMimeType:'application/json',temperature:0.2}});
    // Dos formas de enviar la clave: en cabecera (la normal) y, si el navegador corta la conexión, en la dirección (petición simple, sin comprobación previa)
    function call(i,alt){
      var u='https://generativelanguage.googleapis.com/v1beta/models/'+GMODELS[i]+':generateContent';
      return alt?fetch(u+'?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'text/plain'},body:body,signal:opts&&opts.signal})
        :fetch(u,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:body,signal:opts&&opts.signal});
    }
    var alt=lsGet('rc-galt')==='1';
    function go(i){
      return call(i,alt).catch(function(e){if(e&&e.name==='AbortError')throw e;alt=!alt;return call(i,alt)}).then(function(r){
        lsSet('rc-galt',alt?'1':'0');
        if(r.status===404&&i<GMODELS.length-1)return go(i+1);
        if(!r.ok)return r.json().catch(function(){return {}}).then(function(e){
          var m=(e.error&&e.error.message)||'';
          throw {code:r.status===429?'rate_limited':(r.status===401||r.status===403||/API key/i.test(m))?'bad_key':(r.status===400&&/image/i.test(m))?'image_rejected':'upstream_error',message:m};
        });
        return r.json().then(function(d){
          var c=d.candidates&&d.candidates[0],t=c&&c.content&&c.content.parts?c.content.parts.map(function(p){return p.text||''}).join(''):'';
          if(!t)throw {code:'empty_completion'};
          return parseJ(t);
        });
      });
    }
    return go(0);
  }).catch(function(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};if(e&&e.code)throw e;throw {code:'upstream_error',message:'error de conexión: '+((e&&(e.message||e.name))||String(e))}});
}

var unsub=null,lastWrite=0,lastSeen=0,localDirty=false,verSave=0,loggingOut=false;
function onRemote(snap){
  if(snap.metadata.hasPendingWrites)return;
  var data=snap.exists?snap.data():null,cache=snap.metadata.fromCache;
  if(!data&&cache)return;
  var first=!dbReady;dbReady=true;
  if(first){localDirty=false;clearTimeout(tSave)}
  if(data&&data.json){
    var up=data.updated||0;
    if(up&&(up===lastWrite||up===lastSeen)){if(!busy&&!localDirty){ui.sync=cache?'cache':'cloud';setSync()}return}
    if(!first&&(localDirty||busy)){return}
    var s2;try{s2=JSON.parse(data.json)}catch(e){s2=null}
    if(s2&&s2.recipes){S=norm(s2);lastSeen=up;localSave();ui.sync=cache?'cache':'cloud';if(first||!ui.sheet)renderAll();else{render();setSync()}return}
  }
  if(first){ui.sync='saving';setSync();flush()}
}
function attachDb(){
  lastWrite=0;lastSeen=0;localDirty=false;
  if(unsub){try{unsub()}catch(e){}unsub=null}
  if(dbDoc.listen){unsub=dbDoc.listen(onRemote,function(){ui.sync='deny';setSync()});return}
  dbDoc.get().then(function(snap){onRemote({exists:snap.exists,data:function(){return snap.data()},metadata:{hasPendingWrites:false,fromCache:false}})}).catch(function(){ui.sync='local';setSync()});
}

var scanner=null,scanBusy=false;
function stopScan(){
  var sc=scanner;scanner=null;
  if(sc){try{sc.stop().then(function(){try{sc.clear()}catch(e){}}).catch(function(){})}catch(e){}}
}
function scanMsg(t){var e=document.getElementById('sc-msg');if(e)e.textContent=t||''}

  return '<div class="ph"><h3>Escanear código</h3><button class="x" data-a="scan-cancel" aria-label="Cerrar">×</button></div>'+

function startScan(){
  scanBusy=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg('Este navegador no deja usar la cámara. Escribe el número del código.');return}
  function go(){
    if(!window.Html5Qrcode||!ui.sheet||ui.sheet.t!=='scan')return;
    var F=window.Html5QrcodeSupportedFormats||{};
    try{
      scanner=new Html5Qrcode('sc-box',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E].filter(Boolean),experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
      var cfg={fps:15,aspectRatio:1.333,qrbox:function(w,h){return {width:Math.floor(w*0.9),height:Math.max(80,Math.floor(h*0.45))}},
        videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]}};
      scanner.start({facingMode:'environment'},cfg,function(t){onCode(t)},function(){}).then(function(){setupZoom()}).catch(function(){scanMsg('No puedo abrir la cámara. Revisa el permiso, usa «Hacer foto del código» o escribe el número.')});
    }catch(e){scanMsg('No puedo abrir la cámara. Escribe el número del código.')}
  }
  if(window.Html5Qrcode)go();
  else loadScripts(['https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'],function(err){if(err||!window.Html5Qrcode)scanMsg('No se ha podido cargar el lector. Escribe el número del código.');else go()});
}
function setupZoom(){
  try{
    var cap=scanner&&scanner.getRunningTrackCapabilities&&scanner.getRunningTrackCapabilities();
    if(!cap||!cap.zoom||!(cap.zoom.max>cap.zoom.min))return;
    var z=document.getElementById('sc-z'),box=document.getElementById('sc-zoom');if(!z||!box)return;
    z.min=cap.zoom.min;z.max=Math.min(cap.zoom.max,8);z.step=cap.zoom.step||0.1;
    var start=Math.min(+z.max,Math.max(+z.min,2));z.value=start;box.hidden=false;applyZoom(start);
  }catch(e){}
}
function applyZoom(v){try{if(scanner&&scanner.applyVideoConstraints)scanner.applyVideoConstraints({advanced:[{zoom:+v}]}).catch(function(){})}catch(e){}}

function codePrompt(){return 'En esta imagen hay un código de barras de un producto (EAN-13, EAN-8 o UPC). Lee los dígitos impresos debajo de las barras. Responde SOLO con JSON: {"code":"solo los dígitos, sin espacios"}. Si no se leen con seguridad, {"code":""}.'}
function scanPhoto(file){
  stopScan();scanBusy=false;scanMsg('Leyendo la foto…');
  resizePhoto(file,function(blob){
    if(!blob){scanMsg('No he podido abrir la foto.');return}
    var F=window.Html5QrcodeSupportedFormats||{},tries=[];
    function viaReader(){
      if(!window.Html5Qrcode)return Promise.reject();
      var d=document.getElementById('sc-tmp');if(!d){d=document.createElement('div');d.id='sc-tmp';d.style.display='none';document.body.appendChild(d)}
      var r=new Html5Qrcode('sc-tmp',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E].filter(Boolean),verbose:false});
      return r.scanFile(new File([blob],'codigo.jpg',{type:'image/jpeg'}),false);
    }
    function viaAI(){
      if(!sampleNs||(GH&&!lsGet('rc-gkey')))return Promise.reject();
      scanMsg('La IA está leyendo los números del código…');
      return sampleNs.json(codePrompt(),{images:[blob]}).then(function(j){var c=String((j&&j.code)||'').replace(/\D/g,'');if(c.length<8)throw 0;return c});
    }
    viaReader().catch(viaAI).then(function(c){if(ui.sheet&&ui.sheet.t==='scan')onCode(c)}).catch(function(){
      if(ui.sheet&&ui.sheet.t==='scan')scanMsg('No he podido leer el código en la foto. Prueba con más luz, más cerca, o escribe el número.');
    });
  },2000,0.9);
}
function backToFoods(){stopScan();ui.sheet={t:'foods'};renderSheet()}
function onCode(raw){
  var code=String(raw||'').replace(/\D/g,'');
  if(!code||scanBusy)return;
  scanBusy=true;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  var have=null;S.foods.forEach(function(f){if(f.code===code)have=f});
  if(have){backToFoods();toast('Ya tienes «'+have.n+'» en tu lista');return}
  scanMsg('Buscando producto…');stopScan();
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,quantity,nutriments').then(function(r){return r.json()}).then(function(j){
    if(!ui.sheet||ui.sheet.t!=='scan')return;
    var pr=j&&j.status===1&&j.product,d={code:code};
    if(pr){
      var nu=pr.nutriments||{},kc=nu['energy-kcal_100g'];
      if(kc===undefined&&nu['energy_100g']!==undefined)kc=nu['energy_100g']/4.184;
      var r1=function(v){return v===undefined||v===null||isNaN(+v)?'':Math.round(+v*10)/10};
      var br=String(pr.brands||'').split(',')[0].trim();
      d.n=((pr.product_name||'')+(br&&(pr.product_name||'').toLowerCase().indexOf(br.toLowerCase())<0?' '+br:'')).trim().slice(0,60);
      d.k=r1(kc);d.p=r1(nu.proteins_100g);d.h=r1(nu.carbohydrates_100g);d.g=r1(nu.fat_100g);
      if(/\d\s*(ml|cl|l)\b/i.test(pr.quantity||''))d.t='ml';
      ui.fdraft=d;ui.fnote='Datos de Open Food Facts (los sube la gente). Compáralos con la etiqueta antes de añadir.';ui.fmsg='';
    }else{ui.fdraft={code:code};ui.fnote='';ui.fmsg='No he encontrado ese producto. Rellénalo a mano o prueba con la foto de la etiqueta.'}
    backToFoods();
  }).catch(function(){
    if(!ui.sheet||ui.sheet.t!=='scan')return;
    ui.fdraft={code:code};ui.fnote='';ui.fmsg='No he podido consultar la base de datos. Revisa la conexión o rellénalo a mano.';backToFoods();
  });
}
function labelPrompt(){
  return 'Esta imagen es la etiqueta o tabla nutricional de un producto alimenticio. Responde SOLO con un objeto JSON, sin texto antes ni después.\nFormato exacto: {"n":"nombre del producto si aparece, si no cadena vacía","k":0,"p":0,"h":0,"g":0,"ml":false}\nReglas:\n- k = kcal, p = proteínas (g), h = hidratos de carbono (g), g = grasas (g), SIEMPRE por 100 g o por 100 ml.\n- Si la tabla solo da valores por ración, conviértelos a 100 g/ml con el peso de la ración indicado.\n- La energía va en kcal, no en kJ.\n- ml = true si es un líquido (valores por 100 ml), false si no.\n- Si un valor no se lee con seguridad, pon null. No inventes nada.';
}
function readLabel(file){
  ui.fbusy='La IA está leyendo la etiqueta…';ui.fmsg='';ui.fnote='';renderSheet();
  resizePhoto(file,function(blob){
    if(!blob){ui.fbusy='';ui.fmsg='No he podido leer la imagen.';renderSheet();return}
    sampleNs.json(labelPrompt(),{images:[blob]}).then(function(j){
      ui.fbusy='';
      var r1=function(v){return v===undefined||v===null||isNaN(+v)?'':Math.round(+v*10)/10};
      if(!j||typeof j!=='object')throw {code:'invalid_json'};
      var d={n:String(j.n||'').trim().slice(0,60),k:r1(j.k),p:r1(j.p),h:r1(j.h),g:r1(j.g)};
      if(j.ml===true)d.t='ml';
      if(ui.fdraft&&ui.fdraft.code)d.code=ui.fdraft.code;if(ui.fdraft&&ui.fdraft.c)d.c=ui.fdraft.c;
      ui.fdraft=d;ui.fnote='Leído de la etiqueta con IA. Compáralo con el envase antes de añadir.';
      if(ui.sheet&&ui.sheet.t==='foods')renderSheet();
    }).catch(function(e){
      ui.fbusy='';ui.fmsg=(e&&e.code==='cancelled')?'':errTxt(e);
      if(ui.sheet&&ui.sheet.t==='foods')renderSheet();
    });
  },1600,0.8);
}

var IMP_ERR={no_key:'Falta la clave de Gemini en este dispositivo. Pégala en Ajustes (cada móvil u ordenador necesita la suya pegada una vez).',bad_key:'Google no acepta la clave de Gemini. Revisa en Ajustes que esté copiada entera, sin espacios.',not_granted:'La IA no está disponible: falta la clave o no es válida. Revisa Ajustes.',sampling_disabled:'La IA no está disponible en esta cuenta.',rate_limited:'Demasiadas peticiones seguidas o límite de uso. Espera un poco y vuelve a intentarlo.',image_rejected:'No he podido leer alguna imagen. Prueba con otra captura.',refused:'La IA no ha querido procesar ese contenido. Cambia el texto o la imagen.',invalid_json:'No he conseguido entender la receta. Inténtalo de nuevo o pega el texto más limpio.',empty_completion:'La IA no ha devuelto nada. Inténtalo de nuevo.',prompt_too_large:'El texto es demasiado largo. Pega solo la receta.',session_expired:'Tu sesión ha caducado. Vuelve a abrir la app.'};

function impPrompt(text,hasImg){
  var foods=S.foods.map(function(f){return f.id+'|'+f.n+'|'+f.t}).join('\n');
  return 'Convierte la receta que te doy ('+(hasImg&&text?'texto e imágenes adjuntas':hasImg?'en las imágenes adjuntas':'texto')+') a JSON para mi app de cocina. Responde SOLO con un objeto JSON, sin texto antes ni después, todo en español.\n\n'+
  'Formato exacto:\n{"n":"nombre de la receta","s":raciones (entero),"tipos":["d","c","n","s","p"],"dif":1,"tp":minutos de preparación,"tc":minutos de cocción,'+
  '"mets":[{"m":"horno","t":200,"min":25}],"steps":[{"t":"texto del paso","min":0}],"notes":"trucos o notas, o cadena vacía","ing":[{"name":"ingrediente","q":150,"f":"id o null"}]}\n\n'+
  'Reglas:\n- tipos: d=desayuno, c=comida, n=cena, s=snack, p=postre. Elige los que encajen (uno o varios).\n- dif: 1 fácil, 2 media, 3 difícil.\n- mets (métodos de cocción): m solo puede ser horno, airfryer, sarten, acero (sartén de acero), olla, micro o frio (sin cocinar). Para horno y airfryer t es la temperatura en °C (número). Para sarten, acero y olla t es uno de "bajo","medio-bajo","medio","medio-alto","alto". Para micro t son los vatios (número). Para frio t es "". min son los minutos de ese método. Si la receta no cocina nada, usa un solo método frio. Si hay dos formas de hacerla, incluye ambas.\n- steps: pasos claros y breves, en orden. min solo si el paso exige un tiempo concreto de espera o cocción (en minutos), si no 0.\n- tp y tc: si no vienen en la receta, estímalos con criterio. tc es 0 si no se cocina.\n- ing: q es una cantidad numérica en la unidad del alimento. f es el id del alimento de MI LISTA (abajo) que mejor equivale, o null si no hay ninguno razonable. Si f no es null, q debe estar en la unidad de ese alimento: g o ml, o unidades si la unidad es ud. Convierte cucharadas, tazas, pizcas, etc. a g o ml (1 cucharada de aceite = 15 ml, 1 cucharadita = 5 ml, 1 taza de arroz = 200 g). Si f es null, q en g, ml o unidades aproximadas y name claro. No inventes ingredientes que no estén en la receta.\n- s: si la receta no indica raciones, estima las que salen.\n\n'+

function nearest(v,list){var b=list[0];list.forEach(function(x){if(Math.abs(x-v)<Math.abs(b-v))b=x});return b}
function impBuild(j){
  var d=recFill({id:null,n:String(j.n||'Receta importada').trim().slice(0,80),s:Math.min(24,Math.max(1,Math.round(+j.s)||2)),ing:[]});
  d.tipos=(Array.isArray(j.tipos)?j.tipos:[]).filter(function(k,i,a){return TIPOS[k]&&a.indexOf(k)===i});
  d.dif=[1,2,3].indexOf(+j.dif)>=0?+j.dif:0;
  d.tp=Math.max(0,Math.round(+j.tp)||0);d.tc=Math.max(0,Math.round(+j.tc)||0);
  d.mets=(Array.isArray(j.mets)?j.mets:[]).filter(function(m){return m&&METS[m.m]}).map(function(m){
    var k=METS[m.m].k,t='';
    if(k==='c'){var v=+m.t;if(v>0)t=nearest(v,tempList('c'))}
    else if(k==='f'){t=FUEGO.indexOf(m.t)>=0?m.t:''}
    else if(k==='w'){var w=+m.t;if(w>0)t=nearest(w,WATTS)}
    return {m:m.m,t:t,min:Math.max(0,Math.round(+m.min)||0)};
  });
  d.steps=(Array.isArray(j.steps)?j.steps:[]).filter(function(x){return x&&String(x.t||'').trim()}).map(function(x){return {t:String(x.t).trim(),min:Math.max(0,Math.round(+x.min)||0)}});
  d.notes=String(j.notes||'').trim();
  d.ing=(Array.isArray(j.ing)?j.ing:[]).filter(function(l){return l&&l.name}).map(function(l){
    var q=Math.round((+l.q||0)*10)/10;
    if(l.f&&food(l.f))return {f:l.f,q:q};
    return {f:'',q:q,hint:String(l.name).trim()+(q?' · '+nf1.format(q):'')};
  });
  if(!d.ing.length)d.ing=[{f:'',q:''}];
  return d;
}

function beep(){try{if(ac)[0,0.35,0.7].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.25;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wl){wl.release();wl=null}}catch(e){}}

function tmLeft(t){return t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.left}
function othersTxt(sh){
  var o=[];Object.keys(ui.timers).forEach(function(k){var t=ui.timers[k];if(t.end&&+k!==sh.i||(t.end&&sh.phase!=='step'))o.push('Paso '+(+k+1)+': '+clock(tmLeft(t)))});
  return o.length?'⏱ '+o.join(' · '):'';
}
function onTick(){
  var sh=ui.sheet;if(!sh||sh.t!=='cook')return;
  var fired=[];
  Object.keys(ui.timers).forEach(function(k){var t=ui.timers[k];if(t.end&&Date.now()>=t.end){t.end=0;t.left=0;fired.push(+k)}});
  if(fired.length){beep();toast('¡Tiempo! Paso '+(fired[0]+1));renderSheet()}

var tSave=null,busy=false,dirty=false;
function setSync(){
  var m={cloud:'Guardado',saving:navigator.onLine===false?'Sin conexión · se guardará al volver':'Guardando…',local:navigator.onLine===false?'Sin conexión · guardado en el móvil':'Solo en este dispositivo',err:'Sin guardar',cache:'Sin conexión · guardado en el móvil',deny:'Sin acceso a la nube',big:'Sin guardar: demasiados datos'};

function flush(){
  if(!dbDoc||!dbReady)return Promise.resolve();
  if(busy){dirty=true;return Promise.resolve()}
  var js=JSON.stringify(S);
  if(js.length>950000){ui.sync='big';setSync();toast('Hay demasiados datos para guardarlos en la nube. Avísame para ampliarlo.');return Promise.resolve()}
  busy=true;var v=verSave;lastWrite=Date.now();
  return dbDoc.set({json:js,updated:lastWrite}).then(function(){ui.sync='cloud';if(verSave===v)localDirty=false}).catch(function(){ui.sync='err'}).then(function(){
    busy=false;setSync();if(dirty){dirty=false;flush()}

}

function doCopy(sh,target){
  if(sh.mode==='day')S.plan[target]=cloneDay(S.plan[sh.src]);
  else{
    var a1=weekDays(sh.base),a2=weekDays(target);
    for(var q=0;q<7;q++)S.plan[dkey(a2[q])]=cloneDay(S.plan[dkey(a1[q])]);
    ui.wk=target;
  }
  save();ui.sheet=null;ui.stash=null;renderAll();toast('Copiado');
}
function batchShares(sh){
  var idx=[0,1,2,3,4,5,6].filter(function(i){return sh.days[i]}),n=idx.length,out={};
  if(!n)return out;
  var base=Math.floor(sh.total/n),rem=sh.total%n;
  idx.forEach(function(i,j){out[i]=base+(j<rem?1:0)});

      save();toast('Añadida a la compra');break;
    }
    case 'want-step':S.want[i].s=Math.max(1,S.want[i].s+d);save();render();break;
    case 'want-del':S.want.splice(i,1);save();render();break;
    case 'slot-add':ui.pq='';ui.sheet={t:'pick',target:b.dataset.day==='want'?'want':{day:b.dataset.day,slot:b.dataset.slot}};renderSheet();break;
    case 'pick':{
      var tg=ui.sheet.target,rr=recipe(id);
      if(tg==='want'){var ex2=null;S.want.forEach(function(w){if(w.r===id)ex2=w});if(ex2)ex2.s+=1;else S.want.push({r:id,s:Math.max(1,rr.s||1)})}
      else planList(tg.day,tg.slot).push({r:id,s:1});
      save();ui.sheet=null;ui.pq='';renderAll();toast('Añadida');break;
    }
    case 'plan-step':{var en=planList(b.dataset.day,b.dataset.slot)[i];en.s=Math.max(1,en.s+d);save();render();break}
    case 'plan-del':planList(b.dataset.day,b.dataset.slot).splice(i,1);save();render();break;
    case 'toggle-week':S.useWeek=!S.useWeek;save();render();break;
    case 'check':ckTog(id);save();render();break;
    case 'extra-check':ckTog('x:'+S.extra[i].id);save();render();break;
    case 'extra-del':S.extra.splice(i,1);save();render();break;
    case 'extra-add':addExtra();break;
    case 'uncheck':delete S.chk[ckKey()];save();render();break;
    case 'copy':{
      var tx=listText();if(!tx){toast('No hay nada pendiente');break}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast('Lista copiada')},function(){toast('No se pudo copiar')})}
      else toast('No se pudo copiar');
      break;
    }
  }
});
function addExtra(){
  var el=$('#extra-new'),t=el?el.value.trim():'';if(!t)return;
  S.extra.push({id:'e'+Date.now().toString(36),t:t});save();render();
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='aj-key'){e.preventDefault();e.target.blur();lsSet('rc-gkey',e.target.value.replace(/[^\x21-\x7E]/g,''));toast('Clave guardada');return}
  if(e.key==='Enter'&&(e.target.id==='lg-mail'||e.target.id==='lg-pass')){e.preventDefault();doLogin();return}
  if(e.key==='Enter'&&e.target.id==='extra-new'){e.preventDefault();addExtra()}});
document.addEventListener('focusin',function(e){
  var t=e.target;if(!t||t.tagName!=='INPUT')return;
  if(t.type==='number'||t.inputMode==='decimal'||t.inputMode==='numeric'){setTimeout(function(){try{t.select()}catch(x){}},30)}
});
document.addEventListener('input',function(e){
  var t=e.target,sh=ui.sheet;
  if(t.id==='q'){ui.q=t.value;render()}
  else if(t.id==='pk-q'){ui.pq=t.value;renderSheet()}
  else if(t.id==='fp-q'){ui.fq=t.value;renderSheet()}
  else if(t.id==='goal'){S.goal=parseInt(t.value.replace(/\D/g,''),10)||0;save()}
  else if(t.id==='r-name'&&sh&&sh.draft){sh.draft.n=t.value}
  else if(t.id==='im-text'&&sh&&sh.t==='import'){sh.text=t.value}
  else if(/^fn-(name|k|p|h|g|u)$/.test(t.id)){ui.fdraft[t.id==='fn-name'?'n':t.id.slice(3)]=t.value}
  else if(t.id==='sc-z'){applyZoom(t.value)}
  else if(t.id==='aj-key'){lsSet('rc-gkey',t.value.replace(/[^\x21-\x7E]/g,''));var ok=document.getElementById('aj-ok');if(ok)ok.innerHTML=keyInfo()}
  else if(t.id==='r-notes'&&sh&&sh.draft){sh.draft.notes=t.value}
  else if(t.dataset.st!==undefined&&sh&&sh.draft){sh.draft.steps[+t.dataset.st].t=t.value}
  else if(t.id==='r-serv'&&sh&&sh.draft){sh.draft.s=num(t.value);updateKcal()}
  else if(t.dataset.q!==undefined&&sh&&sh.draft){sh.draft.ing[+t.dataset.q].q=num(t.value);updateKcal()}
  else if(t.id==='pgoal'){S.protGoal=parseInt(t.value.replace(/\D/g,''),10)||0;save()}
  else if(t.dataset.fm!==undefined){var f=food(t.dataset.id);if(f){f[t.dataset.fm]=num(t.value);save()}}
});
document.addEventListener('change',function(e){
  var t=e.target,sh=ui.sheet;
  if(t.id==='goal'||t.id==='pgoal'){render();return}
  if(t.id==='fn-t'){ui.fdraft.t=t.value;return}
  if(t.id==='fn-c'){ui.fdraft.c=t.value;return}
  if(t.id==='sc-photo'&&sh&&sh.t==='scan'){var sp=t.files&&t.files[0];if(sp)scanPhoto(sp);return}
  if(t.id==='fl-img'&&sh&&sh.t==='foods'){var lf=t.files&&t.files[0];if(lf)readLabel(lf);return}
  if(t.id==='bk-file'&&sh&&sh.t==='ajustes'){
    var bf=t.files&&t.files[0];if(!bf)return;
    var rd=new FileReader();rd.onload=function(){
      try{var o=JSON.parse(rd.result);if(!o||!Array.isArray(o.recipes)||!Array.isArray(o.foods))throw 0;if(ui.sheet===sh){sh.pending=o;renderSheet()}}
      catch(x){toast('Ese archivo no es una copia válida')}
    };rd.readAsText(bf);return;
  }
  if(t.id==='im-img'&&sh&&sh.t==='import'){
    var fl=Array.prototype.slice.call(t.files||[]),mx=(sampleImgs&&sampleImgs.maxCount)||3;
    fl=fl.slice(0,Math.max(0,mx-sh.imgs.length));
    var left=fl.length;if(!left)return;
    fl.forEach(function(f){resizePhoto(f,function(b){if(b&&ui.sheet===sh)sh.imgs.push(b);left--;if(!left)renderSheet()},1600,0.8)});
    return;
  }
  if(sh&&sh.draft){
    var dd=sh.draft;
    if(t.id==='r-dif'){dd.dif=+t.value;return}
    if(t.id==='r-tp'||t.id==='r-tc'){
      dd[t.id==='r-tp'?'tp':'tc']=+t.value;
      var te=document.getElementById('r-tt'),tt=(dd.tp||0)+(dd.tc||0);if(te)te.textContent=tt?mtime(tt):'—';
      t.blur();return;
    }
    if(t.dataset.ms!==undefined){
      var m=dd.mets[+t.dataset.ms],k0=(METS[m.m]||METS.sarten).k;m.m=t.value;var k1=METS[m.m].k;
      if(k0!==k1)m.t='';
      var row=t.closest('.met-row'),ts=row&&row.querySelector('[data-mt]');
      if(ts){ts.innerHTML=tempOpts(k1,m.t);ts.hidden=(k1==='0')}
      t.blur();return;
    }
    if(t.dataset.mt!==undefined){var mm=dd.mets[+t.dataset.mt],kk=METS[mm.m].k;mm.t=t.value===''?'':(kk==='f'?t.value:+t.value);t.blur();return}
    if(t.dataset.mm!==undefined){dd.mets[+t.dataset.mm].min=+t.value;t.blur();return}
    if(t.dataset.sm!==undefined){dd.steps[+t.dataset.sm].min=+t.value;t.blur();return}
    if(t.id==='r-photo'){
      var file=t.files&&t.files[0];if(!file||!assetsNs)return;
      toast('Subiendo foto…');
      resizePhoto(file,function(blob){
        if(!blob){toast('No se pudo leer la foto');return}
        assetsNs.upload(blob,{type:'image/jpeg'}).then(function(res){
          if(ui.sheet===sh){dd.fid=res.id;sh.newFids.push(res.id);renderSheet();toast('Foto añadida')}
          else dropFids([res.id]);
        }).catch(function(){toast('No se pudo subir la foto')});
      });
      return;
    }
  }
  if(t.dataset.f!==undefined&&sh&&sh.draft){
    if(t.value==='__new'){t.blur();ui.stash=sh;ui.sheet={t:'foods'};renderSheet();return}
    // No se vuelve a pintar la hoja: así el desplegable del móvil se cierra solo al elegir
    sh.draft.ing[+t.dataset.f].f=t.value;
    var row=t.closest('.ing'),un=row&&row.querySelector('.u');
    if(un)un.textContent=unitOf(food(t.value));
    updateKcal();t.blur();
  }
});

renderAll();
initDb();
})();
</script>

</body>
</html>
